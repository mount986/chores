      {# ── Edit form (slides open below header) ── #}
      <div x-show="editOpen" x-cloak class="border-t border-gray-100 px-4 pb-4 pt-3">
        <form method="POST"
              action="{{ url_for('parent.edit_chore_value', ac_id=cfg.id) }}"
              class="space-y-3">
          <div class="flex flex-wrap gap-3">
            <div class="flex-1 min-w-36">
              <label class="block text-xs font-semibold text-gray-400 mb-1">Name</label>
              <input type="text" name="override_name"
                     value="{{ cfg.override_name or '' }}"
                     placeholder="{{ cfg.chore.name }}"
                     class="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
            </div>
            <div class="w-28">
              <label class="block text-xs font-semibold text-gray-400 mb-1">Reward ($)</label>
              <input type="number" name="custom_value" step="0.05" min="0"
                     value="{{ '%.2f'|format(cfg.effective_value) }}"
                     class="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Description</label>
            <input type="text" name="override_description"
                   value="{{ cfg.override_description or '' }}"
                   placeholder="{{ cfg.chore.description or 'Optional description…' }}"
                   class="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
          </div>
          <div>
            <label class="flex items-center gap-2 cursor-pointer select-none mb-2">
              <input type="checkbox" name="is_recurring" x-model="recurring"
                     class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-300">
              <span class="text-sm font-medium text-gray-600">🔁 Recurring chore</span>
            </label>
            <div x-show="recurring" x-cloak class="flex flex-wrap items-end gap-3 pl-1">
              <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Repeats</label>
                <select name="recurrence_cadence" x-model="cadence"
                        class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>
              </div>
              <div x-show="cadence === 'weekly'">
                <label class="block text-xs font-semibold text-gray-400 mb-1">Day of week</label>
                <select name="recurrence_day"
                        class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
                  {% for i, dname in [(0,'Monday'),(1,'Tuesday'),(2,'Wednesday'),(3,'Thursday'),(4,'Friday'),(5,'Saturday'),(6,'Sunday')] %}
                  <option value="{{ i }}" {{ 'selected' if row.rec_day == i }}>{{ dname }}</option>
                  {% endfor %}
                </select>
              </div>
              <div x-show="cadence === 'monthly'">
                <label class="block text-xs font-semibold text-gray-400 mb-1">Day of month</label>
                <select name="recurrence_day"
                        class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
                  {% for d in range(1, 29) %}
                  <option value="{{ d }}" {{ 'selected' if row.rec_day == d }}>
                    {{ d }}{{ 'st' if d == 1 else ('nd' if d == 2 else ('rd' if d == 3 else 'th')) }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>
          <div class="flex gap-2">
            <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-1.5 rounded-lg transition-colors active:scale-95">
              Save
            </button>
            <button type="button" @click="editOpen = false" class="text-gray-400 hover:text-gray-600 text-sm px-2">
              Cancel
            </button>
          </div>
        </form>
      </div>
