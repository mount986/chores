{% from '_macros.html' import avatar %}
<!-- Child header -->
<div class="bg-white rounded-2xl shadow-sm p-5 mb-6 flex flex-wrap items-center gap-4">
  {{ avatar(child, 'w-16 h-16', 'text-3xl') }}
  <div class="flex-1">
    <h1 class="text-2xl font-bold text-gray-800">{{ child.name }}</h1>
    <div class="{{ 'text-red-600' if child.balance < 0 else 'text-emerald-600' }} font-semibold text-lg">${{ "%.2f"|format(child.balance) }} balance</div>
  </div>

  <!-- Wishlist link -->
  <a href="{{ url_for('parent.child_wishlist', child_id=child.id) }}"
     class="bg-violet-100 hover:bg-violet-200 text-violet-700 font-semibold px-4 py-2 rounded-xl text-sm transition-colors">
    🛒 Wishlist
  </a>

  <!-- Quick purchase -->
  <div x-data="{ open: false }" class="relative">
    <button @click="open = !open"
            class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-semibold px-4 py-2 rounded-xl text-sm transition-colors">
      🛍️ Purchase
    </button>
    <div x-show="open" x-cloak @click.outside="open = false"
         class="absolute right-0 mt-2 w-72 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 z-20">
      <div class="text-sm font-bold text-gray-700 mb-3">Record a Purchase</div>
      <form method="POST" action="{{ url_for('parent.quick_purchase', child_id=child.id) }}"
            class="space-y-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Item name <span class="text-red-400">*</span></label>
          <input type="text" name="name" placeholder="e.g. Ice cream" required
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Price <span class="text-red-400">*</span></label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
            <input type="number" name="price" step="0.01" min="0.01" placeholder="0.00" required
                   class="w-full border border-gray-200 rounded-lg pl-7 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Note (optional)</label>
          <input type="text" name="description" placeholder="Color, size, occasion…"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300">
        </div>
        <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl text-sm transition-colors active:scale-95 mt-1">
          Record Purchase
        </button>
      </form>
    </div>
  </div>

  <!-- Adjust balance (positive = credit, negative = penalty) -->
  <div x-data="{ open: false, amt: '' }" class="relative">
    <button @click="open = !open"
            class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-xl text-sm transition-colors">
      Adjust Balance
    </button>
    <div x-show="open" x-cloak @click.outside="open = false"
         class="absolute right-0 mt-2 w-68 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 z-20"
         style="min-width:17rem">
      <div class="text-sm font-bold mb-1"
           :class="parseFloat(amt) < 0 ? 'text-red-600' : 'text-gray-700'"
           x-text="parseFloat(amt) < 0 ? 'Apply Penalty' : 'Adjust Balance'"></div>
      <form method="POST" action="{{ url_for('parent.adjust_balance', child_id=child.id) }}"
            class="space-y-2 mt-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">
            Amount <span class="font-normal text-gray-400">(negative = penalty)</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
            <input type="number" name="amount" step="0.01" placeholder="e.g. 5.00 or -2.00" required
                   x-model="amt"
                   class="w-full border border-gray-200 rounded-lg pl-7 pr-3 py-2 text-sm focus:outline-none focus:ring-2"
                   :class="parseFloat(amt) < 0 ? 'focus:ring-red-300' : 'focus:ring-indigo-300'">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1"
                 x-text="parseFloat(amt) < 0 ? 'Reason (optional)' : 'Note (optional)'"></label>
          <input type="text" name="reason"
                 :placeholder="parseFloat(amt) < 0 ? 'e.g. Broke a rule…' : 'e.g. Birthday bonus'"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                 :class="parseFloat(amt) < 0 ? 'focus:ring-red-300' : 'focus:ring-indigo-300'">
        </div>
        <button class="w-full text-white font-semibold py-2 rounded-xl text-sm transition-colors active:scale-95"
                :class="parseFloat(amt) < 0 ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'"
                x-text="parseFloat(amt) < 0 ? 'Apply Penalty' : 'Apply'">
        </button>
      </form>
    </div>
  </div>
</div>
