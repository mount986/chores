  <!-- Children management -->
  <div class="bg-white rounded-2xl shadow-sm p-5">
    <h2 class="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2">👨‍👩‍👧 Children</h2>

    {% if children %}
    <div class="space-y-2 mb-5">
{% from '_macros.html' import avatar %}
      {% for child in children %}
      <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
        <label class="relative cursor-pointer shrink-0" title="Upload photo">
          {{ avatar(child, 'w-10 h-10', 'text-lg') }}
          <form method="POST" action="{{ url_for('parent.upload_avatar', child_id=child.id) }}"
                enctype="multipart/form-data" id="avatar-form-{{ child.id }}">
            <input type="file" name="avatar" accept="image/*" class="hidden"
                   onchange="document.getElementById('avatar-form-{{ child.id }}').submit()">
          </form>
          <div class="absolute inset-0 rounded-full bg-black bg-opacity-0 hover:bg-opacity-30 flex items-center justify-center transition-all">
            <svg class="w-4 h-4 text-white opacity-0 hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
        </label>
        <div class="flex-1">
          <div class="font-semibold text-gray-800">{{ child.name }}</div>
          <div class="{{ 'text-red-600' if child.balance < 0 else 'text-emerald-600' }} text-sm">${{ "%.2f"|format(child.balance) }} balance</div>
        </div>
        <a href="{{ url_for('parent.child_detail', child_id=child.id) }}"
           class="text-indigo-600 hover:text-indigo-800 text-sm font-medium transition-colors">
          Manage
        </a>
        <form method="POST" action="{{ url_for('parent.remove_child', child_id=child.id) }}"
              onsubmit="return confirm('Remove {{ child.name }}? This will delete all their chores and history.')">
          <button class="text-gray-300 hover:text-red-400 transition-colors p-1" title="Remove">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
        </form>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Add child form -->
    <form method="POST" action="{{ url_for('parent.add_child') }}" class="flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-32">
        <label class="block text-xs font-semibold text-gray-500 mb-1">Child's Name</label>
        <input type="text" name="name" required placeholder="e.g. Emma"
               class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">Avatar Color</label>
        <input type="color" name="color" value="#6366f1"
               class="h-9 w-16 rounded-xl border border-gray-200 cursor-pointer p-0.5">
      </div>
      <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-xl text-sm transition-colors active:scale-95">
        Add Child
      </button>
    </form>
  </div>
